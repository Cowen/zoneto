[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoneto"
version = "0.1.0"
description = "Toronto building application data pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "duckdb>=1.0",
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "joblib>=1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.0",
    "pyproj>=3.6",
    "rich>=13.0",
    "scikit-learn>=1.4",
    "scikit-survival>=0.27.0",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "shap>=0.46",
    "shapely>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "pydantic-ai-slim[anthropic]>=1.107.0",
]

[project.scripts]
zoneto = "zoneto.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zoneto"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local enriched parquet (skip with -m 'not integration')",
]
filterwarnings = [
    # sklearn emits these when CV folds have too few samples (expected with tiny test fixtures)
    "ignore:R\\^2 score is not well-defined:sklearn.exceptions.UndefinedMetricWarning",
    "ignore:Only one class is present in y_true:sklearn.exceptions.UndefinedMetricWarning",
    "ignore:No positive class found in y_true:UserWarning:sklearn",
    "ignore:Skipping features without any observed values:UserWarning:sklearn",
    # TruncatedSVD warns on tiny corpus (expected when testing with minimal fixtures)
    "ignore::RuntimeWarning:sklearn",
]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
