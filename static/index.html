<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoneto — Toronto Development Application Intelligence</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      color: #212529;
      padding: 2rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .tagline { color: #6c757d; font-size: 0.9rem; margin-bottom: 2rem; }

    .card {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      max-width: 1400px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; color: #495057; }
    input, select {
      width: 100%; padding: 0.5rem 0.75rem;
      border: 1px solid #ced4da; border-radius: 4px;
      font-size: 0.9rem;
    }
    input:focus, select:focus { outline: 2px solid #0d6efd; outline-offset: 1px; }

    button[type="submit"] {
      background: #0d6efd; color: #fff;
      border: none; border-radius: 4px;
      padding: 0.6rem 1.5rem; font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: #0b5ed7; }
    button[type="submit"]:disabled { background: #6c757d; cursor: not-allowed; }

    #status { font-size: 0.85rem; color: #6c757d; margin-top: 0.5rem; min-height: 1.2rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      text-align: left; padding: 0.6rem 0.75rem;
      border-bottom: 2px solid #dee2e6;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: #6c757d;
    }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #f1f3f5; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #f8f9fa; }
    tr:hover td { background: #e9ecef; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: #343a40; background: #f1f3f5; }
    th.sort-active { color: #0d6efd; }
    th .sort-arrow { font-size: 0.65rem; margin-left: 0.2rem; }
    .desc-cell { max-width: 240px; }
    .desc-cell div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .badge {
      display: inline-block; padding: 0.2rem 0.5rem;
      border-radius: 3px; font-size: 0.75rem; font-weight: 600;
    }
    .badge-appealed { background: #fff3cd; color: #856404; }
    .badge-approved { background: #d1e7dd; color: #0a3622; }
    .badge-active   { background: #cff4fc; color: #055160; }

    .pred-box {
      background: #f8f9fa; border: 1px solid #dee2e6;
      border-radius: 6px; padding: 1rem; margin-top: 0.5rem;
    }
    .pred-box h3 { font-size: 0.85rem; color: #6c757d; margin-bottom: 0.5rem; }
    .pred-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.25rem; }
    .pred-label { color: #495057; }
    .pred-value { font-weight: 600; }

    .empty { text-align: center; color: #6c757d; padding: 2rem; }

    #score-section { display: none; }
    #scenarios-section { display: none; }

    .badge-best { background: #d1e7dd; color: #0a3622; }
    .risk-low  { color: #198754; font-weight: 600; }
    .risk-mid  { color: #856404; font-weight: 600; }
    .risk-high { color: #dc3545; font-weight: 600; }
    .scenario-loading { color: #6c757d; font-style: italic; font-size: 0.85rem; padding: 1rem; }

    /* Site context flags */
    .site-context {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 1rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid #e9ecef;
    }
    .ctx-flag {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.25rem 0.6rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600;
      position: relative;
    }
    .ctx-flag-on  { background: #e8f4f8; color: #0c5460; border: 1px solid #bee5eb; }
    .ctx-flag-off { background: #f8f9fa; color: #adb5bd; border: 1px solid #e9ecef; }
    .ctx-flag-warn { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    [data-tooltip] { position: relative; cursor: default; }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%; transform: translateX(-50%);
      background: #212529; color: #fff;
      font-size: 0.72rem; font-weight: 400;
      padding: 0.4rem 0.6rem; border-radius: 4px;
      white-space: normal; width: 220px; text-align: left;
      z-index: 100; pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    [data-tooltip]:hover::before {
      content: '';
      position: absolute;
      bottom: calc(100% + 2px);
      left: 50%; transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: #212529;
      z-index: 100;
    }
    .ctx-flag a { color: inherit; text-decoration: none; }
    .ctx-flag a:hover { text-decoration: underline; }

    /* Base rate summary */
    .base-rate {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      padding: 0.75rem 1rem; margin-bottom: 1rem;
      background: #f8f9fa; border-radius: 6px; border: 1px solid #e9ecef;
      font-size: 0.82rem;
    }
    .base-rate-item { display: flex; flex-direction: column; }
    .base-rate-value { font-weight: 700; font-size: 0.95rem; color: #212529; }
    .base-rate-label { font-size: 0.7rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Custom scenario form */
    .custom-scorer {
      display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;
      margin-top: 0.75rem; padding-top: 0.75rem;
      border-top: 1px solid #e9ecef;
    }
    .custom-scorer label { font-size: 0.7rem; margin-bottom: 0.15rem; }
    .custom-scorer input, .custom-scorer select {
      padding: 0.35rem 0.5rem; font-size: 0.82rem; width: auto; min-width: 80px;
    }
    .custom-scorer button {
      background: #495057; color: #fff; border: none; border-radius: 4px;
      padding: 0.4rem 1rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      white-space: nowrap;
    }
    .custom-scorer button:hover { background: #343a40; }
    .custom-scorer button:disabled { background: #adb5bd; cursor: not-allowed; }

    /* SHAP mini-explanation */
    .shap-inline {
      margin-top: 0.5rem; padding: 0.6rem 0.75rem;
      background: #f8f9fa; border-radius: 5px; border: 1px solid #e9ecef;
      font-size: 0.78rem;
    }
    .shap-inline-title { font-size: 0.7rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.35rem; }
    .shap-factor { display: inline-block; margin-right: 0.75rem; margin-bottom: 0.2rem; }

    /* Model footnote */
    .model-footnote {
      font-size: 0.72rem; color: #adb5bd; margin-top: 0.75rem;
      padding-top: 0.5rem; border-top: 1px solid #f1f3f5;
      line-height: 1.4;
    }
    /* Map */
    #map { height: 300px; border-radius: 4px; z-index: 0; }
    .map-legend {
      display: flex; gap: 1rem; flex-wrap: wrap;
      margin-top: 0.5rem; font-size: 0.72rem; color: #6c757d;
    }
    .map-legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .map-legend-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <h1>Zoneto</h1>
  <p class="tagline">Toronto development application intelligence</p>

  <div class="card">
    <form id="query-form">
      <div class="form-grid">
        <div>
          <label for="type">Application Type</label>
          <select id="type" name="type">
            <option value="">Any</option>
            <option value="OZ">OZ — Official Plan / Zoning</option>
            <option value="SA">SA — Site Plan Approval</option>
            <option value="OPA">OPA — Official Plan Amendment</option>
          </select>
        </div>
        <div>
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="e.g. 441 King St W, Toronto" />
        </div>
        <div>
          <label for="radius">Radius (m)</label>
          <input type="number" id="radius" name="radius" value="500" min="50" max="5000" />
        </div>
        <div>
          <label for="years">Years back</label>
          <input type="number" id="years" name="years" value="5" min="1" max="20" />
        </div>
      </div>
      <button type="submit">Find Comparable Applications</button>
      <div id="status"></div>
    </form>
  </div>

  <div class="card" id="score-section">
    <div class="pred-box">
      <h3>ML Predictions (production-ready models only)</h3>
      <div id="predictions"></div>
    </div>
  </div>

  <div class="card" id="scenarios-section">
    <h2 style="font-size:1rem;font-weight:700;margin-bottom:0.75rem">What could I build here?</h2>
    <p style="font-size:0.8rem;color:#6c757d;margin-bottom:1rem">
      Scenarios calibrated to nearby applications. Site context from the nearest comp.
    </p>
    <div id="site-context"></div>
    <div id="map" style="margin-bottom:0.5rem"></div>
    <div class="map-legend" id="map-legend" style="display:none;margin-bottom:1rem">
      <div class="map-legend-item"><div class="map-legend-dot" style="background:#0d6efd"></div>Searched address</div>
      <div class="map-legend-item"><div class="map-legend-dot" style="background:#198754"></div>Approved</div>
      <div class="map-legend-item"><div class="map-legend-dot" style="background:#856404;opacity:0.8"></div>Appealed</div>
      <div class="map-legend-item"><div class="map-legend-dot" style="background:#0c5460"></div>Other / active</div>
    </div>
    <div id="base-rate"></div>
    <div id="scenarios-body"></div>
    <div id="required-studies"></div>
    <div id="shap-best"></div>
    <div id="custom-scorer-container"></div>
    <div id="model-footnote"></div>
  </div>

  <div class="card" id="results-card" style="display:none">
    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById('query-form');
    const statusEl = document.getElementById('status');
    const resultsCard = document.getElementById('results-card');
    const resultsEl = document.getElementById('results');
    const scoreSection = document.getElementById('score-section');
    const predictionsEl = document.getElementById('predictions');
    const scenariosSection = document.getElementById('scenarios-section');
    const scenariosBody = document.getElementById('scenarios-body');
    const siteContextEl = document.getElementById('site-context');
    const baseRateEl = document.getElementById('base-rate');
    const shapBestEl = document.getElementById('shap-best');
    const customScorerEl = document.getElementById('custom-scorer-container');
    const modelFootnoteEl = document.getElementById('model-footnote');
    const requiredStudiesEl = document.getElementById('required-studies');
    const mapLegendEl = document.getElementById('map-legend');
    let _map = null;
    let _mapLayers = [];

    function initMap(lat, lon, radiusM, applications) {
      mapLegendEl.style.display = 'flex';
      if (!_map) {
        _map = L.map('map').setView([lat, lon], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 20,
        }).addTo(_map);
      } else {
        _map.setView([lat, lon], 14);
      }
      _map.invalidateSize();

      _mapLayers.forEach(l => _map.removeLayer(l));
      _mapLayers = [];

      // Radius circle
      const circle = L.circle([lat, lon], {
        radius: radiusM, color: '#0d6efd', weight: 1.5,
        fillColor: '#0d6efd', fillOpacity: 0.05,
      }).addTo(_map);
      _mapLayers.push(circle);

      // Searched address pin — custom SVG, no stock Leaflet icon
      const searchIcon = L.divIcon({
        html: `<svg width="22" height="30" viewBox="0 0 22 30" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 0C4.925 0 0 4.925 0 11c0 8.25 11 19 11 19s11-10.75 11-19C22 4.925 17.075 0 11 0z" fill="#0d6efd"/>
          <circle cx="11" cy="11" r="4.5" fill="#fff"/>
        </svg>`,
        iconSize: [22, 30], iconAnchor: [11, 30], popupAnchor: [0, -32],
        className: '',
      });
      const pin = L.marker([lat, lon], { icon: searchIcon }).addTo(_map);
      pin.bindPopup('<strong>Searched address</strong>');
      _mapLayers.push(pin);

      // Comp markers
      applications.forEach(app => {
        if (app.lat == null || app.lon == null) return;
        const color = app.dev_appealed === 1 ? '#856404'
                    : app.dev_approved  === 1 ? '#198754'
                    : '#0c5460';
        const dot = L.circleMarker([app.lat, app.lon], {
          radius: 6, color: '#fff', fillColor: color, fillOpacity: 0.85, weight: 1.5,
        }).addTo(_map);
        const addr = app.street_address?.trim() || '';
        dot.bindPopup(
          `<strong>${escHtml(app.folderrsn ?? '')}</strong><br>` +
          `${escHtml(app.application_type ?? '')} · ${escHtml(String(app.year_submitted ?? ''))}<br>` +
          (addr ? escHtml(addr) : '')
        );
        _mapLayers.push(dot);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      resultsCard.style.display = 'none';
      scoreSection.style.display = 'none';
      scenariosSection.style.display = 'none';

      try {
        const rawAddress = document.getElementById('address').value.trim();
        const torontoRe = /\b(toronto|north york|east york|scarborough|etobicoke|york)\b/i;
        const address = torontoRe.test(rawAddress) ? rawAddress : `${rawAddress}, Toronto, Ontario`;
        const type = document.getElementById('type').value;
        const radius = document.getElementById('radius').value;
        const years = document.getElementById('years').value;

        if (!address) {
          throw new Error('Please enter an address.');
        }

        // Geocode address via backend proxy
        statusEl.textContent = 'Geocoding address…';
        const geoRes = await fetch('/geocode?' + new URLSearchParams({ address }));
        if (!geoRes.ok) {
          const err = await geoRes.json().catch(() => ({ detail: geoRes.statusText }));
          throw new Error('Geocoding failed — ' + (err.detail || geoRes.statusText) + '. Try again.');
        }
        const geo = await geoRes.json();
        const lat = geo.lat;
        const lon = geo.lon;
        statusEl.textContent = `Geocoded: ${geo.display_name}`;

        const urlParams = new URLSearchParams({ address: rawAddress });
        if (type)   urlParams.set('type', type);
        if (radius) urlParams.set('radius', radius);
        if (years)  urlParams.set('years', years);
        history.pushState({ address: rawAddress, type, radius, years }, '', '?' + urlParams.toString());

        // Fetch comparable applications
        const params = new URLSearchParams();
        if (type) params.set('type', type);
        params.set('lat', lat);
        params.set('lon', lon);
        if (radius) params.set('radius_m', radius);
        if (years)  params.set('years', years);

        const res = await fetch('/comps?' + params.toString());
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || res.statusText);
        }

        const data = await res.json();
        renderResults(data);
        initMap(lat, lon, Number(radius), data.applications);
        statusEl.textContent = `${geo.display_name} — ${data.total} comparable application${data.total !== 1 ? 's' : ''} found`;

        // Score if application type provided
        if (type) {
          await fetchScore({ application_type: type, ward_number: null, lat, lon });
        }

        // "What could I build here?" panel — always show site context + scenarios
        await fetchScenarios(data.applications, lat, lon);
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    const TYPE_LABELS = {
      OZ:  'Official Plan Amendment and/or Zoning By-law Amendment — requires City Council approval',
      SA:  'Site Plan Approval — staff-level approval for detailed design of a permitted use',
      OPA: 'Official Plan Amendment (standalone) — changes land-use designation without rezoning',
      CD:  'Plan of Subdivision / Consent to Divide — creates new lots or parcels',
      MV:  'Minor Variance — small deviation from zoning standards; decided by Committee of Adjustment',
    };

    const ZONE_LABELS = {
      RD:  'Residential Detached — permits single detached dwellings',
      RS:  'Residential Semi-Detached — permits semi-detached dwellings',
      RT:  'Residential Townhouse — permits townhouse and row dwellings',
      RM:  'Residential Multiple — permits low-rise multiple dwellings',
      RA:  'Residential Apartment — permits mid/high-rise apartment buildings',
      R:   'Residential — general residential zone (older designation)',
      CR:  'Commercial Residential — mixed-use with retail/office and residential above',
      CL:  'Commercial Linear — strip commercial along arterial roads',
      CS:  'Commercial Service — auto-oriented and service commercial uses',
      CG:  'Commercial General — broad range of retail and service uses',
      E:   'Employment — general employment uses (offices, light manufacturing)',
      EL:  'Employment Light — light industrial and service uses',
      EH:  'Employment Heavy — heavy industrial uses',
      EO:  'Employment Office — office and knowledge-economy uses',
      EU:  'Employment Utility — utility and infrastructure uses',
      O:   'Open Space — parks and publicly accessible open space',
      ON:  'Open Space Natural — natural areas and ravines',
      OR:  'Open Space Recreation — recreational facilities and sports fields',
      I:   'Institutional — schools, hospitals, places of worship',
      T:   'Transportation — transit corridors and rail lands',
      UT:  'Utility and Transportation — utility infrastructure',
      FU:  'Future Use — lands deferred for future planning',
    };

    function zoneTooltip(code) {
      if (!code) return '';
      const prefix = code.replace(/[^A-Za-z]/g, '');
      for (let len = prefix.length; len > 0; len--) {
        const label = ZONE_LABELS[prefix.slice(0, len)];
        if (label) return label;
      }
      return '';
    }

    const RESULT_COLS = [
      { key: 'folderrsn',             label: 'Folder RSN', type: 'str' },
      { key: 'application_type',      label: 'Type',       type: 'str' },
      { key: 'street_address',        label: 'Address',    type: 'str' },
      { key: 'description',           label: 'Description', type: 'str' },
      { key: 'zoning_class',          label: 'Zone',       type: 'str' },
      { key: 'year_submitted',        label: 'Year',       type: 'num' },
      { key: 'status',                label: 'Status',     type: 'str' },
      { key: 'dev_days_to_decision',  label: 'Timeline',   type: 'num' },
      { key: 'proposed_storeys',      label: 'Storeys',    type: 'num' },
      { key: 'proposed_units',        label: 'Units',      type: 'num' },
    ];
    let _lastApplications = [];
    let _sortCol = null;
    let _sortDir = 'asc';

    function renderResults(data) {
      if (!data.applications.length) {
        resultsEl.innerHTML = '<p class="empty">No comparable applications found. Try broadening your search.</p>';
        resultsCard.style.display = 'block';
        return;
      }
      _lastApplications = data.applications;
      _sortCol = null;
      _sortDir = 'asc';
      buildResultsTable();
    }

    function buildResultsTable() {
      const apps = [..._lastApplications];
      if (_sortCol != null) {
        const col = RESULT_COLS[_sortCol];
        apps.sort((a, b) => {
          const av = a[col.key] ?? null;
          const bv = b[col.key] ?? null;
          if (av === null && bv === null) return 0;
          if (av === null) return 1;
          if (bv === null) return -1;
          const cmp = col.type === 'num' ? (av - bv) : String(av).localeCompare(String(bv));
          return _sortDir === 'asc' ? cmp : -cmp;
        });
      }

      const headers = RESULT_COLS.map((col, i) => {
        const active = _sortCol === i;
        const arrow = active
          ? `<span class="sort-arrow">${_sortDir === 'asc' ? '▲' : '▼'}</span>`
          : `<span class="sort-arrow" style="opacity:0.25">▲</span>`;
        return `<th class="sortable${active ? ' sort-active' : ''}" data-col="${i}">${col.label}${arrow}</th>`;
      }).join('');

      const rows = apps.map(app => {
        const timeline = app.dev_days_to_decision ? `${Math.round(app.dev_days_to_decision / 30)} mo` : '—';
        return `<tr>
          <td>${app.application_url ? `<a href="${escHtml(app.application_url)}" target="_blank" rel="noopener noreferrer">${escHtml(app.folderrsn ?? '')}</a>` : escHtml(app.folderrsn ?? '')}</td>
          <td>${app.application_type ? `<span data-tooltip="${escHtml(TYPE_LABELS[app.application_type] ?? '')}">${escHtml(app.application_type)}</span>` : ''}</td>
          <td>${escHtml(app.street_address?.trim() ?? '')}</td>
          <td class="desc-cell">${app.description?.trim() ? `<div title="${escHtml(app.description.trim())}">${escHtml(app.description.trim())}</div>` : '—'}</td>
          <td>${app.zoning_class ? `<span data-tooltip="${escHtml(zoneTooltip(app.zoning_class))}">${escHtml(app.zoning_class)}</span>` : ''}</td>
          <td>${escHtml(app.year_submitted?.toString() ?? '')}</td>
          <td>${formatStatus(app.status)}</td>
          <td>${timeline}</td>
          <td>${app.proposed_storeys ?? '—'}</td>
          <td>${app.proposed_units ?? '—'}</td>
        </tr>`;
      }).join('');

      resultsEl.innerHTML = `<table>
        <thead><tr>${headers}</tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

      resultsEl.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', () => {
          const col = Number(th.dataset.col);
          if (_sortCol === col) {
            _sortDir = _sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            _sortCol = col;
            _sortDir = 'asc';
          }
          buildResultsTable();
        });
      });

      resultsCard.style.display = 'block';
    }

    function formatStatus(status) {
      if (!status) return '—';
      const lc = status.toLowerCase();
      if (lc.includes('appeal')) return `<span class="badge badge-appealed">${escHtml(status)}</span>`;
      if (lc.includes('approv')) return `<span class="badge badge-approved">${escHtml(status)}</span>`;
      if (lc.includes('active') || lc.includes('review') || lc.includes('circulat'))
        return `<span class="badge badge-active">${escHtml(status)}</span>`;
      return escHtml(status);
    }

    async function fetchScore(features) {
      try {
        const res = await fetch('/score?explain=true', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'dev_applications', features }),
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.production_ready_models.length) return;
        renderPredictions(data.predictions);
        if (data.explanations) renderExplanations(data.explanations);
      } catch (_) {
        // predictions are optional — fail silently
      }
    }

    function renderPredictions(predictions) {
      const rows = Object.entries(predictions).map(([key, val]) => {
        const label = key.replace(/^(prob_|pred_)/, '').replace(/_/g, ' ');
        const formatted = typeof val === 'number'
          ? (val < 1 && val > 0 ? (val * 100).toFixed(1) + '%' : val.toFixed(1))
          : String(val);
        return `<div class="pred-row"><span class="pred-label">${escHtml(label)}</span><span class="pred-value">${escHtml(formatted)}</span></div>`;
      }).join('');

      if (rows) {
        predictionsEl.innerHTML = rows;
        scoreSection.style.display = 'block';
      }
    }

    function renderExplanations(explanations) {
      const entries = Object.entries(explanations);
      if (!entries.length) return;
      const rows = entries.flatMap(([modelName, contribs]) => {
        const modelLabel = `<div style="font-size:0.7rem;color:#adb5bd;margin-bottom:0.25rem">${escHtml(modelName.replace(/_/g, ' '))}</div>`;
        const contribRows = contribs.map(c => {
          const sign = c.direction === 'increases_risk' ? '+' : '−';
          const color = c.direction === 'increases_risk' ? '#dc3545' : '#198754';
          const label = escHtml(c.feature.replace(/__/g, ': ').replace(/_/g, ' '));
          return `<div class="pred-row">
            <span class="pred-label">${label}</span>
            <span class="pred-value" style="color:${color}">${sign}${Math.abs(c.shap_value).toFixed(3)}</span>
          </div>`;
        }).join('');
        return modelLabel + contribRows;
      }).join('');
      if (rows) {
        predictionsEl.innerHTML += `
          <div style="margin-top:0.75rem;border-top:1px solid #dee2e6;padding-top:0.75rem">
            <div style="font-size:0.75rem;color:#6c757d;margin-bottom:0.4rem">Top contributing factors</div>
            ${rows}
          </div>`;
      }
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // --- "What could I build here?" ---

    const FALLBACK_SCENARIOS = [
      { label: 'Low-rise OZ',  application_type: 'OZ', proposed_storeys: 6,  proposed_units: 30,  has_parent_application: 0, is_combined_application: 0 },
      { label: 'Mid-rise OZ',  application_type: 'OZ', proposed_storeys: 15, proposed_units: 100, has_parent_application: 0, is_combined_application: 0 },
      { label: 'High-rise OZ', application_type: 'OZ', proposed_storeys: 35, proposed_units: 300, has_parent_application: 0, is_combined_application: 0 },
      { label: 'OZ + OPA',     application_type: 'OZ', proposed_storeys: 20, proposed_units: 150, has_parent_application: 0, is_combined_application: 1 },
      { label: 'Site Plan (SA)', application_type: 'SA', proposed_storeys: 6, proposed_units: 30, has_parent_application: 1, is_combined_application: 0 },
    ];

    // Saved between calls so the custom scorer can reuse it
    let _lastSiteCtx = null;

    function percentile(sorted, p) {
      const i = (p / 100) * (sorted.length - 1);
      const lo = Math.floor(i), hi = Math.ceil(i);
      return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
    }

    function buildScenariosFromComps(applications) {
      const withStoreys = applications.filter(a => a.proposed_storeys != null && a.proposed_storeys > 0);
      const withUnits   = applications.filter(a => a.proposed_units != null && a.proposed_units > 0);

      if (withStoreys.length < 5 || withUnits.length < 5) return FALLBACK_SCENARIOS;

      const sortedS = withStoreys.map(a => a.proposed_storeys).sort((a, b) => a - b);
      const sortedU = withUnits.map(a => a.proposed_units).sort((a, b) => a - b);

      const s25 = Math.round(percentile(sortedS, 25));
      const s50 = Math.round(percentile(sortedS, 50));
      const s75 = Math.round(percentile(sortedS, 75));
      const u25 = Math.round(percentile(sortedU, 25));
      const u50 = Math.round(percentile(sortedU, 50));
      const u75 = Math.round(percentile(sortedU, 75));

      // Determine dominant application type from comps
      const typeCounts = {};
      applications.forEach(a => { if (a.application_type) typeCounts[a.application_type] = (typeCounts[a.application_type] || 0) + 1; });
      const dominantType = Object.entries(typeCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'OZ';

      const scenarios = [
        { label: 'Conservative', application_type: dominantType, proposed_storeys: s25, proposed_units: u25, has_parent_application: 0, is_combined_application: 0 },
        { label: 'Typical',      application_type: dominantType, proposed_storeys: s50, proposed_units: u50, has_parent_application: 0, is_combined_application: 0 },
        { label: 'Ambitious',    application_type: dominantType, proposed_storeys: s75, proposed_units: u75, has_parent_application: 0, is_combined_application: 0 },
      ];

      // Add an OZ+OPA combined scenario if dominant type is OZ
      if (dominantType === 'OZ') {
        scenarios.push({ label: 'OZ + OPA', application_type: 'OZ', proposed_storeys: s75, proposed_units: u75, has_parent_application: 0, is_combined_application: 1 });
      }

      // Add an SA scenario if there are SA comps
      if (typeCounts['SA'] && typeCounts['SA'] >= 2) {
        const saStoreys = withStoreys.filter(a => a.application_type === 'SA');
        const saMedian = saStoreys.length >= 2 ? Math.round(percentile(saStoreys.map(a => a.proposed_storeys).sort((a, b) => a - b), 50)) : s25;
        const saUnits = withUnits.filter(a => a.application_type === 'SA');
        const saUnitMedian = saUnits.length >= 2 ? Math.round(percentile(saUnits.map(a => a.proposed_units).sort((a, b) => a - b), 50)) : u25;
        scenarios.push({ label: 'Site Plan (SA)', application_type: 'SA', proposed_storeys: saMedian, proposed_units: saUnitMedian, has_parent_application: 1, is_combined_application: 0 });
      }

      return scenarios;
    }

    function extractSiteCtx(nearestComp) {
      return {
        ward_number:           nearestComp.ward_number ?? null,
        zoning_class:          nearestComp.zoning_class ?? null,
        secondary_plan_name:   nearestComp.secondary_plan_name ?? null,
        in_heritage_register:  nearestComp.in_heritage_register ?? null,
        in_heritage_district:  nearestComp.in_heritage_district ?? null,
        in_secondary_plan:     nearestComp.in_secondary_plan ?? null,
        in_mtsa:               nearestComp.in_mtsa ?? null,

        ward_appeal_rate_3y:   nearestComp.ward_appeal_rate_3y ?? null,
        year_submitted:        new Date().getFullYear(),
        has_community_meeting: 0,
      };
    }

    const ZONING_PREFIX_DESC = {
      CRE: 'Commercial Residential Employment — allows commercial, residential, and employment uses in the same area.',
      CR:  'Commercial Residential — mixed commercial and residential uses permitted.',
      C:   'Commercial — primarily retail, service, and office uses.',
      RD:  'Residential Detached — primarily single detached dwellings.',
      RS:  'Residential Semi-Detached — semi-detached and detached dwellings.',
      RM:  'Residential Multiple — multiple dwellings including apartments.',
      RT:  'Residential Townhouse — townhouse and stacked dwelling formats.',
      R:   'Residential — general residential zone.',
      EH:  'Employment Heavy Industrial — heavy industrial and manufacturing uses.',
      EL:  'Employment Light Industrial — light industrial and employment uses.',
      EO:  'Employment Office — office and business park uses.',
      E:   'Employment Industrial — employment and industrial uses.',
      ON:  'Open Space Natural — protected natural heritage lands.',
      OR:  'Open Space Recreation — active parks and recreation areas.',
      O:   'Open Space — parks and open recreational uses.',
      EU:  'Utility and Transportation — infrastructure and transit facilities.',

    function zoningDesc(code) {
      if (!code) return null;
      for (const [prefix, desc] of Object.entries(ZONING_PREFIX_DESC)) {
        if (code.toUpperCase().startsWith(prefix)) return desc;
      }
      return null;
    }

    const _BYLAW_BASE = 'https://www.toronto.ca/zoning/bylaw_amendments/';
    // Longest prefix first so RAC beats RA, IPW beats I, etc.
    const ZONING_BYLAW_URLS = {
      RAC: 'ZBL_NewProvision_Chapter15_20.htm',
      RA:  'ZBL_NewProvision_Chapter15_10.htm',
      RD:  'ZBL_NewProvision_Chapter10_20.htm',
      RS:  'ZBL_NewProvision_Chapter10_40.htm',
      RT:  'ZBL_NewProvision_Chapter10_60.htm',
      RM:  'ZBL_NewProvision_Chapter10_80.htm',
      R:   'ZBL_NewProvision_Chapter10_10.htm',
      CRE: 'ZBL_NewProvision_Chapter50_10.htm',
      CR:  'ZBL_NewProvision_Chapter40.htm',
      C:   'ZBL_NewProvision_Chapter30.htm',
      EH:  'ZBL_NewProvision_Chapter60_30.htm',
      EL:  'ZBL_NewProvision_Chapter60_10.htm',
      EO:  'ZBL_NewProvision_Chapter60_40.htm',
      E:   'ZBL_NewProvision_Chapter60_20.htm',
      IPW: 'ZBL_NewProvision_Chapter80_50.htm',
      IH:  'ZBL_NewProvision_Chapter80_20.htm',
      IE:  'ZBL_NewProvision_Chapter80_30.htm',
      IS:  'ZBL_NewProvision_Chapter80_40.htm',
      I:   'ZBL_NewProvision_Chapter80_10.htm',
      OG:  'ZBL_NewProvision_Chapter90_40.htm',
      OM:  'ZBL_NewProvision_Chapter90_50.htm',
      OC:  'ZBL_NewProvision_Chapter90_70.htm',
      ON:  'ZBL_NewProvision_Chapter90_20.htm',
      OR:  'ZBL_NewProvision_Chapter90_30.htm',
      O:   'ZBL_NewProvision_Chapter90_10.htm',
      EU:  'ZBL_NewProvision_Chapter100_10.htm',
      UT:  'ZBL_NewProvision_Chapter100_10.htm',
    };

    function zoningBylawUrl(code) {
      if (!code) return _BYLAW_BASE + 'ZBL_NewProvision_Chapter1.htm';
      const uc = code.toUpperCase();
      for (const [prefix, page] of Object.entries(ZONING_BYLAW_URLS)) {
        if (uc.startsWith(prefix)) return _BYLAW_BASE + page;
      }
      return _BYLAW_BASE + 'ZBL_NewProvision_Chapter1.htm';
    }

    // Map zone code prefixes to By-law 569-2013 Chapter 900 section numbers
    const ZONE_TO_CHAPTER_SECTION = {
      RAC: 8, RA: 7, RM: 6, RT: 5, RS: 4, RD: 3, R: 2,
      CRE: 12, CR: 11, CL: 10,
      EO: 24, EH: 22, EL: 21, E: 20,
      IPW: 34, IS: 33, IE: 32, IH: 31, I: 30,
      OC: 45, OG: 43, OM: 50, ON: 41, OR: 42, O: 40,
      UT: 50,
    };

    function zoneExceptionUrl(zoneCode, exceptionNo) {
      if (!zoneCode) return null;
      const uc = zoneCode.toUpperCase();
      // Extract zone prefix (longest match first to handle RAC before RA, etc)
      let section = null;
      let zonePrefix = null;
      for (const [prefix, sec] of Object.entries(ZONE_TO_CHAPTER_SECTION)) {
        if (uc.startsWith(prefix)) {
          section = sec;
          zonePrefix = prefix;
          break;
        }
      }
      if (section === null) return null;
      const base = `${_BYLAW_BASE}ZBL_NewProvision_Chapter900_${section}.htm`;
      // Use text fragment to highlight the specific exception
      if (exceptionNo && zonePrefix) {
        const textToFind = `Exception ${zonePrefix} ${exceptionNo}`;
        return `${base}#:~:text=${encodeURIComponent(textToFind)}`;
      }
      return base;
    }

    // Mirror of analytics/use_classifier._ZONE_ALLOWED. Keep in sync.
    const ZONE_ALLOWED_USES = {
      'Residential':                              new Set(['residential', 'mixed_use']),
      'Residential Apartment':                    new Set(['residential', 'mixed_use']),
      'Commercial Residential (mixed)':           new Set(['residential', 'commercial', 'mixed_use']),
      'Commercial Residential Employment (mixed)':new Set(['residential', 'commercial', 'employment', 'mixed_use']),
      'Commercial':                               new Set(['commercial', 'mixed_use']),
      'Employment Industrial':                    new Set(['employment']),
      'Institutional':                            new Set(['institutional']),
      'Open Space':                               new Set(),
      'Utility / Transportation':                 new Set(),
    };

    function useMatchesZone(proposed, permittedCategory) {
      if (proposed == null || permittedCategory == null) return null;
      const allowed = ZONE_ALLOWED_USES[permittedCategory];
      if (allowed == null) return null;
      return allowed.has(proposed) ? 1 : 0;
    }

    // OZ/SA application types imply a rezoning/site-plan path; we treat both as
    // 'mixed_use'-capable since they don't pin a specific use bucket on their own.
    function inferUseForScenario(scenario) {
      // SA/SP applications attach to an existing rezoning; the underlying use
      // is unknown from type alone, so we don't claim a mismatch.
      if (scenario.application_type === 'SA') return null;
      // OZ scenarios that don't carry an inferred use default to 'mixed_use'
      // until the custom scorer or description provides a specific bucket.
      return scenario.proposed_use_category ?? null;
    }

    function renderSiteContext(ctx) {
      const flag = (label, value, warnIfOn, { tooltip, href } = {}) => {
        const on = value === 1 || value === true;
        const cls = on ? (warnIfOn ? 'ctx-flag-warn' : 'ctx-flag-on') : 'ctx-flag-off';
        const icon = on ? 'Yes' : 'No';
        const tipAttr = tooltip ? ` data-tooltip="${escHtml(tooltip)}"` : '';
        const inner = href
          ? `<a href="${escHtml(href)}" target="_blank" rel="noopener">${escHtml(label)}: ${icon}</a>`
          : `${escHtml(label)}: ${icon}`;
        return `<span class="ctx-flag ${cls}"${tipAttr}>${inner}</span>`;
      };

      let html = '';

      // Ward + zoning badge
      if (ctx.ward_number || ctx.zoning_class) {
        const wardNum = ctx.ward_number ? String(ctx.ward_number) : null;
        const zDesc = zoningDesc(ctx.zoning_class);
        let tipParts = [];
        if (wardNum) tipParts.push(`Ward ${wardNum} — Toronto City Council electoral ward.`);
        if (zDesc) tipParts.push(zDesc);
        tipParts.push('Click to read By-law 569-2013 regulations for this zone type.');
        const tip = tipParts.join(' ');

        let inner = '';
        if (wardNum) {
          const wardHref = `https://www.toronto.ca/city-government/council/members-of-council/councillor-ward-${wardNum}/`;
          inner += `<a href="${escHtml(wardHref)}" target="_blank" rel="noopener">Ward ${escHtml(wardNum)}</a>`;
        }
        if (ctx.zoning_class) {
          if (inner) inner += ' / ';
          inner += `<a href="${escHtml(zoningBylawUrl(ctx.zoning_class))}" target="_blank" rel="noopener">${escHtml(ctx.zoning_class)}</a>`;
        }
        html += `<span class="ctx-flag ctx-flag-on" data-tooltip="${escHtml(tip)}">${inner}</span>`;
      }

      if (ctx.permitted_use_category) {
        html += `<span class="ctx-flag ctx-flag-on" data-tooltip="${escHtml('As-of-right uses for this zone (By-law 569-2013 General Zone category). Anything else needs a rezoning (OZ).')}">Permits: ${escHtml(ctx.permitted_use_category)}</span>`;
      }
      if (ctx.zoning_max_units != null) {
        html += `<span class="ctx-flag ctx-flag-on" data-tooltip="Maximum dwelling units permitted under the as-of-right zoning. Proposals exceeding this require a rezoning or minor variance.">Zoning permits: ${ctx.zoning_max_units} units</span>`;
      }
      if (ctx.zoning_max_density != null) {
        html += `<span class="ctx-flag ctx-flag-on" data-tooltip="Maximum floor space index (FSI) — total floor area relative to lot area. Exceeding this requires a rezoning or official plan amendment.">Max density: ${ctx.zoning_max_density} FSI</span>`;
      }

      // Lot/coverage minimums grouped together — only render when at least one is set
      const lotParts = [];
      if (ctx.zoning_min_frontage_m != null) lotParts.push(`Min frontage: ${ctx.zoning_min_frontage_m} m`);
      if (ctx.zoning_min_lot_area_sqm != null) lotParts.push(`Min lot area: ${ctx.zoning_min_lot_area_sqm} m²`);
      if (ctx.zoning_max_coverage_pct != null) lotParts.push(`Max coverage: ${ctx.zoning_max_coverage_pct}%`);
      if (ctx.zoning_min_sqm_per_unit != null) lotParts.push(`Min ${ctx.zoning_min_sqm_per_unit} m²/unit`);
      if (lotParts.length) {
        const tip = "Physical lot requirements from By-law 569-2013. New buildings or severances that don't meet these need a minor variance from the Committee of Adjustment.";
        html += `<span class="ctx-flag ctx-flag-on" data-tooltip="${escHtml(tip)}">${escHtml(lotParts.join(' · '))}</span>`;
      }

      // Mixed-use FSI splits (only shown when any are present)
      if (ctx.zoning_pct_res != null || ctx.zoning_pct_comm != null || ctx.zoning_pct_emp != null) {
        const parts = [
          ctx.zoning_pct_res != null ? `Res ${ctx.zoning_pct_res}` : null,
          ctx.zoning_pct_comm != null ? `Comm ${ctx.zoning_pct_comm}` : null,
          ctx.zoning_pct_emp != null ? `Emp ${ctx.zoning_pct_emp}` : null,
        ].filter(Boolean).join(' / ');
        const tip = "FSI (floor space index) split for this mixed-use zone — maximum density allowable for each use component.";
        html += `<span class="ctx-flag ctx-flag-on" data-tooltip="${escHtml(tip)}">FSI split: ${escHtml(parts)}</span>`;
      }

      if (ctx.zoning_holding === 1) {
        const tip = "Site is subject to a Holding Symbol (H). Conditions in the by-law must be satisfied — typically via a separate H-removal application — before any building permit can be issued.";
        html += `<span class="ctx-flag ctx-flag-warn" data-tooltip="${escHtml(tip)}">Holding (H)</span>`;
      }

      if (ctx.zoning_exception === 1) {
        const label = ctx.zoning_exception_no ? `Exception #${ctx.zoning_exception_no}` : 'Zone exception';

        const href = zoneExceptionUrl(ctx.zoning_class, ctx.zoning_exception_no);
        if (href) {
          html += `<span class="ctx-flag ctx-flag-on" data-tooltip="${escHtml(tip)}"><a href="${escHtml(href)}" target="_blank" rel="noopener">${escHtml(label)}</a></span>`;
        } else {
          html += `<span class="ctx-flag ctx-flag-on" data-tooltip="${escHtml(tip)}">${escHtml(label)}</span>`;

      // Regulatory flags
      html += flag('Heritage Register', ctx.in_heritage_register, true, {
        tooltip: ctx.in_heritage_register
          ? "Listed on Toronto's Heritage Register. Requires a Heritage Impact Assessment for demolition or significant alterations. Does not prohibit development but adds regulatory review."
          : "Not listed on Toronto's Heritage Register.",
        href: 'https://www.toronto.ca/city-government/planning-development/heritage-preservation/heritage-register/',
      });
      html += flag('Heritage District', ctx.in_heritage_district, true, {
        tooltip: ctx.in_heritage_district
          ? "Falls within a Heritage Conservation District. All alterations must conform to district guidelines and receive Heritage Preservation Services review."
          : "Not within a Heritage Conservation District.",
        href: 'https://www.toronto.ca/city-government/planning-development/heritage-preservation/heritage-conservation-districts-planning-studies/',
      });
      html += flag('MTSA Zone', ctx.in_mtsa, false, {
        tooltip: ctx.in_mtsa
          ? "Major Transit Station Area — city and provincial policy supports increased density near rapid transit stations. Provincially mandated minimum densities apply."
          : "Not in a Major Transit Station Area.",
        href: 'https://www.toronto.ca/city-government/planning-development/planning-studies-initiatives/zoning-for-major-transit-station-areas/',
      });
      html += flag('Secondary Plan', ctx.in_secondary_plan, false, {
        tooltip: ctx.in_secondary_plan
          ? "Covered by a Secondary Plan that sets detailed land-use policies for this area. Applications must conform to the plan's policies in addition to the Official Plan."
          : "Not covered by a Secondary Plan.",
        href: 'https://www.toronto.ca/city-government/planning-development/official-plan-guidelines/official-plan/chapter-6-secondary-plans/',
      });
      if (ctx.secondary_plan_name) {
        const spHref = 'https://www.toronto.ca/city-government/planning-development/official-plan-guidelines/official-plan/chapter-6-secondary-plans/';
        html += `<span class="ctx-flag ctx-flag-on" data-tooltip="${escHtml('The specific Secondary Plan governing this area. Click to browse all Toronto Secondary Plans.')}"><a href="${escHtml(spHref)}" target="_blank" rel="noopener">${escHtml(ctx.secondary_plan_name)}</a></span>`;
      }
      if (ctx.ward_appeal_rate_3y != null) {
        const rate = (ctx.ward_appeal_rate_3y * 100).toFixed(0);
        const cls = ctx.ward_appeal_rate_3y > 0.20 ? 'ctx-flag-warn' : 'ctx-flag-on';
        const tip = "Share of OZ and SA applications in this ward appealed to the Ontario Land Tribunal in the three years before this application was filed. Excludes future data to avoid leakage.";
        html += `<span class="ctx-flag ${cls}" data-tooltip="${escHtml(tip)}">Ward appeal rate (3yr): ${rate}%</span>`;
      }
      siteContextEl.innerHTML = html ? `<div class="site-context">${html}</div>` : '';
    }

    function renderBaseRate(applications) {
      const withAppealLabel = applications.filter(a => a.dev_appealed != null);
      const appealed = withAppealLabel.filter(a => a.dev_appealed === 1);
      const withTimeline = applications.filter(a => a.dev_days_to_decision != null && a.dev_days_to_decision > 0);

      if (withAppealLabel.length === 0 && withTimeline.length === 0) {
        baseRateEl.innerHTML = '';
        return;
      }

      let html = '<div class="base-rate">';
      html += `<div class="base-rate-item"><span class="base-rate-value">${applications.length}</span><span class="base-rate-label">Nearby comps</span></div>`;

      if (withAppealLabel.length > 0) {
        const pct = (appealed.length / withAppealLabel.length * 100).toFixed(0);
        html += `<div class="base-rate-item"><span class="base-rate-value">${appealed.length} of ${withAppealLabel.length} (${pct}%)</span><span class="base-rate-label">Actually appealed</span></div>`;
      }

      if (withTimeline.length > 0) {
        const sorted = withTimeline.map(a => a.dev_days_to_decision).sort((a, b) => a - b);
        const median = Math.round(percentile(sorted, 50) / 30);
        html += `<div class="base-rate-item"><span class="base-rate-value">${median} months</span><span class="base-rate-label">Median time to decision</span></div>`;
      }

      const withStoreys = applications.filter(a => a.proposed_storeys != null && a.proposed_storeys > 0);
      if (withStoreys.length > 0) {
        const sorted = withStoreys.map(a => a.proposed_storeys).sort((a, b) => a - b);
        const median = Math.round(percentile(sorted, 50));
        html += `<div class="base-rate-item"><span class="base-rate-value">${median} storeys</span><span class="base-rate-label">Typical project</span></div>`;
      }

      html += '</div>';
      baseRateEl.innerHTML = html;
    }

    async function scoreOneScenario(features) {
      try {
        const res = await fetch('/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'dev_applications', features }),
        });
        if (!res.ok) return { predictions: null };
        return await res.json();
      } catch (_) {
        return { predictions: null };
      }
    }

    async function fetchScenarios(applications, lat, lon) {
      scenariosBody.innerHTML = '<p class="scenario-loading">Scoring hypothetical scenarios…</p>';
      scenariosSection.style.display = 'block';
      if (_map) _map.invalidateSize();
      shapBestEl.innerHTML = '';
      customScorerEl.innerHTML = '';
      modelFootnoteEl.innerHTML = '';
      requiredStudiesEl.innerHTML = '';

      const nearestComp = applications[0] ?? {};

      // Look up actual spatial context at the searched address
      // Falls back to nearest comp if the endpoint fails
      let spatialCtx = {};
      try {
        const ctxRes = await fetch(`/site-context?lat=${lat}&lon=${lon}`);
        if (ctxRes.ok) spatialCtx = await ctxRes.json();
      } catch (_) { /* fall back to comp */ }

      // Merge: real spatial flags from /site-context, demographics from nearest comp
      const siteCtx = {
        // Spatial flags — prefer actual lookup, fall back to comp
        zoning_class:          spatialCtx.zoning_class ?? nearestComp.zoning_class ?? null,
        secondary_plan_name:   spatialCtx.secondary_plan_name ?? nearestComp.secondary_plan_name ?? null,
        in_heritage_register:  spatialCtx.in_heritage_register ?? nearestComp.in_heritage_register ?? null,
        in_heritage_district:  spatialCtx.in_heritage_district ?? nearestComp.in_heritage_district ?? null,
        in_secondary_plan:     spatialCtx.in_secondary_plan ?? nearestComp.in_secondary_plan ?? null,
        in_mtsa:               spatialCtx.in_mtsa ?? nearestComp.in_mtsa ?? null,
        // Zoning limits (display only — not model features)
        zoning_max_units:      spatialCtx.zoning_max_units ?? null,
        zoning_max_density:    spatialCtx.zoning_max_density ?? null,
        // Expanded by-law fields (display only)
        permitted_use_category:  spatialCtx.permitted_use_category ?? null,
        zoning_min_frontage_m:   spatialCtx.zoning_min_frontage_m ?? null,
        zoning_min_lot_area_sqm: spatialCtx.zoning_min_lot_area_sqm ?? null,
        zoning_max_coverage_pct: spatialCtx.zoning_max_coverage_pct ?? null,
        zoning_min_sqm_per_unit: spatialCtx.zoning_min_sqm_per_unit ?? null,
        zoning_holding:          spatialCtx.zoning_holding ?? 0,
        zoning_exception:        spatialCtx.zoning_exception ?? 0,
        zoning_exception_no:     spatialCtx.zoning_exception_no ?? null,
        zoning_pct_res:          spatialCtx.zoning_pct_res ?? null,
        zoning_pct_comm:         spatialCtx.zoning_pct_comm ?? null,
        zoning_pct_emp:          spatialCtx.zoning_pct_emp ?? null,
        // Ward demographics — only available from comps (census data joined by ward)
        ward_number:           nearestComp.ward_number ?? null,
        ward_pct_renters:      nearestComp.ward_pct_renters ?? null,
        ward_median_income:    nearestComp.ward_median_income ?? null,
        ward_pop_density:      nearestComp.ward_pop_density ?? null,
        ward_pct_detached:     nearestComp.ward_pct_detached ?? null,
        ward_appeal_rate_3y:   nearestComp.ward_appeal_rate_3y ?? null,
        year_submitted:        new Date().getFullYear(),
        has_community_meeting: 0,
      };
      _lastSiteCtx = siteCtx;

      // Render site context and base rate
      renderSiteContext(siteCtx);
      renderBaseRate(applications);

      // Build scenarios from comps data
      const scenarios = buildScenariosFromComps(applications);

      const results = await Promise.all(
        scenarios.map(async (s) => {
          const features = { ...siteCtx, ...s };
          delete features.label;
          const data = await scoreOneScenario(features);
          return { scenario: s, predictions: data.predictions, ready: data.production_ready_models };
        })
      );

      renderScenarios(results, nearestComp);

      // Fetch SHAP explanation for the best-fit (lowest appeal risk) scenario
      const bestIdx = results.reduce((best, r, i) => {
        const risk = r.predictions?.prob_dev_appealed ?? Infinity;
        return risk < (results[best]?.predictions?.prob_dev_appealed ?? Infinity) ? i : best;
      }, 0);
      if (results[bestIdx]?.predictions?.prob_dev_appealed != null) {
        fetchBestShap(scenarios[bestIdx], siteCtx);
      }

      // Render custom scorer, required studies, and model footnote
      renderCustomScorer();
      renderRequiredStudies(siteCtx, applications);
      renderModelFootnote();
    }

    async function fetchBestShap(scenario, siteCtx) {
      try {
        const features = { ...siteCtx, ...scenario };
        delete features.label;
        const res = await fetch('/score?explain=true', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'dev_applications', features }),
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.explanations) return;

        const allContribs = Object.values(data.explanations).flat();
        if (allContribs.length === 0) return;

        // Show top 5 factors
        const top = allContribs.sort((a, b) => Math.abs(b.shap_value) - Math.abs(a.shap_value)).slice(0, 5);
        const factors = top.map(c => {
          const color = c.direction === 'increases_risk' ? '#dc3545' : '#198754';
          const arrow = c.direction === 'increases_risk' ? '\u2191' : '\u2193';
          const label = c.feature.replace(/__/g, ': ').replace(/_/g, ' ');
          return `<span class="shap-factor" style="color:${color}">${arrow} ${escHtml(label)}</span>`;
        }).join('');

        shapBestEl.innerHTML = `<div class="shap-inline">
          <div class="shap-inline-title">Why "${escHtml(scenario.label)}" has lowest risk</div>
          ${factors}
        </div>`;
      } catch (_) {
        // SHAP is optional
      }
    }

    function renderCustomScorer() {
      customScorerEl.innerHTML = `
        <div class="custom-scorer">
          <div>
            <label for="custom-type">Type</label>
            <select id="custom-type">
              <option value="OZ">OZ</option>
              <option value="SA">SA</option>
            </select>
          </div>
          <div>
            <label for="custom-use">Proposed use</label>
            <select id="custom-use">
              <option value="residential">Residential</option>
              <option value="mixed_use">Mixed-use</option>
              <option value="commercial">Commercial</option>
              <option value="employment">Employment</option>
              <option value="institutional">Institutional</option>
            </select>
          </div>
          <div>
            <label for="custom-storeys">Storeys</label>
            <input type="number" id="custom-storeys" min="1" max="99" value="12" style="width:70px" />
          </div>
          <div>
            <label for="custom-units">Units</label>
            <input type="number" id="custom-units" min="1" max="9999" value="60" style="width:80px" />
          </div>
          <button type="button" id="custom-score-btn">Score my proposal</button>
          <div id="custom-result" style="font-size:0.82rem;display:flex;align-items:center;gap:0.5rem"></div>
        </div>`;

      document.getElementById('custom-score-btn').addEventListener('click', async () => {
        const btn = document.getElementById('custom-score-btn');
        const resultEl = document.getElementById('custom-result');
        if (!_lastSiteCtx) return;

        btn.disabled = true;
        resultEl.textContent = 'Scoring…';

        // proposedUse is used for the ⚠ mismatch overlay only — it is NOT sent
        // to /score because keyword-classified use has zero permutation
        // importance on the appeal model and destabilizes CV when included.
        const proposedUse = document.getElementById('custom-use').value;
        const features = {
          ..._lastSiteCtx,
          application_type: document.getElementById('custom-type').value,
          proposed_storeys: parseInt(document.getElementById('custom-storeys').value) || 12,
          proposed_units:   parseInt(document.getElementById('custom-units').value) || 60,
          has_parent_application: document.getElementById('custom-type').value === 'SA' ? 1 : 0,
          is_combined_application: 0,
        };

        const data = await scoreOneScenario(features);
        btn.disabled = false;

        if (!data.predictions || Object.keys(data.predictions).length === 0) {
          resultEl.innerHTML = '<span style="color:#adb5bd">No predictions available</span>';
          return;
        }

        const p = data.predictions;
        let html = '';
        // Show the zoning being used for this score
        const zone = _lastSiteCtx?.zoning_class;
        if (zone) {
          html += `<span class="ctx-flag ctx-flag-on" style="font-size:0.72rem">Zone: ${escHtml(zone)}</span>`;
        }
        // Show excess vs zoning
        const maxUnits = _lastSiteCtx?.zoning_max_units;
        const proposedUnits = parseInt(document.getElementById('custom-units').value) || 0;
        if (maxUnits != null && proposedUnits > maxUnits) {
          const mult = (proposedUnits / maxUnits).toFixed(1);
          html += `<span class="ctx-flag ctx-flag-warn" style="font-size:0.72rem">${mult}x zoning limit</span>`;
        }
        // Use-vs-zone mismatch
        const useMatch = useMatchesZone(proposedUse, _lastSiteCtx?.permitted_use_category);
        if (useMatch === 0) {
          const tip = `This zone permits ${_lastSiteCtx?.permitted_use_category} as-of-right. A ${proposedUse} proposal requires a rezoning (OZ).`;
          html += `<span class="ctx-flag ctx-flag-warn" style="font-size:0.72rem" data-tooltip="${escHtml(tip)}">⚠ Use mismatch</span>`;
        }
        if (p.prob_dev_appealed != null) {
          const risk = (p.prob_dev_appealed * 100).toFixed(0);
          const cls = p.prob_dev_appealed < 0.2 ? 'risk-low' : p.prob_dev_appealed < 0.35 ? 'risk-mid' : 'risk-high';
          html += `<span class="${cls}">Appeal risk: ${risk}%</span>`;
        }
        if (p.pred_dev_days_p25 != null && p.pred_dev_days_p75 != null) {
          const lo = Math.round(p.pred_dev_days_p25 / 30);
          const hi = Math.round(p.pred_dev_days_p75 / 30);
          html += `<span style="color:#495057">Timeline: ${lo}\u2013${hi} mo</span>`;
        }
        resultEl.innerHTML = html || '<span style="color:#adb5bd">\u2014</span>';
      });
    }

    function renderModelFootnote() {
      modelFootnoteEl.innerHTML = `<div class="model-footnote">
        Appeal model AUC ~0.68, timeline model C-index ~0.74.
        The model does not capture how much a proposal exceeds the zoning limit
        or whether the proposed use matches the zone — a 12-storey building in
        a low-rise zone, or a residential proposal in an industrial zone, may
        show lower risk than reality. The use mismatch and zoning-excess badges
        flag those cases independently of the model. Compare predictions
        against the nearby track record above.
      </div>`;
    }

    function renderRequiredStudies(ctx, applications) {
      // Derive a checklist of studies/processes a developer will likely need to
      // file alongside their application, based purely on flags already known.
      const items = [];
      if (ctx.in_heritage_register === 1) {
        items.push({
          label: 'Heritage Impact Assessment',
          why: 'Property is on the Heritage Register — significant alterations or demolition require an HIA reviewed by Heritage Preservation Services.',
        });
      }
      if (ctx.in_heritage_district === 1) {
        items.push({
          label: 'Heritage Conservation District conformity',
          why: 'Site is inside a Heritage Conservation District — proposals must conform to the HCD Plan and receive HPS review.',
        });
      }
      if (ctx.in_secondary_plan === 1) {
        items.push({
          label: 'Secondary Plan conformity',
          why: `Site is covered by ${ctx.secondary_plan_name ?? 'a Secondary Plan'} — the application must demonstrate conformity with that plan's policies in addition to the Official Plan.`,
        });
      }
      if (ctx.in_mtsa === 1) {
        items.push({
          label: 'MTSA / PPS minimum density',
          why: 'Site is inside a Major Transit Station Area — provincial policy requires minimum residential/job density. Low-density proposals will face provincial-policy scrutiny.',
        });
      }
      if (ctx.zoning_holding === 1) {
        items.push({
          label: 'Holding Symbol (H) removal',
          why: 'Site is subject to a Holding Symbol. A separate H-removal application is required before a building permit can be issued.',
        });
      }
      if (ctx.zoning_exception === 1) {
        const lbl = ctx.zoning_exception_no ? `exception #${ctx.zoning_exception_no}` : 'site-specific exception';
        items.push({
          label: 'Confirm site-specific exception',
          why: `Site has ${lbl} — confirm the exception's conditions still permit the proposed form and use before relying on as-of-right zoning.`,
        });
      }

      // Derive rezoning trigger from comps (most aggressive scenario seen nearby)
      const withStoreys = applications.filter(a => a.proposed_storeys != null && a.proposed_storeys > 0);
      const withUnits = applications.filter(a => a.proposed_units != null && a.proposed_units > 0);
      const maxNearbyStoreys = withStoreys.length ? Math.max(...withStoreys.map(a => a.proposed_storeys)) : null;
      const maxNearbyUnits = withUnits.length ? Math.max(...withUnits.map(a => a.proposed_units)) : null;
      const exceedsStoreys = ctx.zoning_max_storeys != null && maxNearbyStoreys != null && maxNearbyStoreys > ctx.zoning_max_storeys;
      const exceedsUnits = ctx.zoning_max_units != null && maxNearbyUnits != null && maxNearbyUnits > ctx.zoning_max_units;
      if (exceedsStoreys || exceedsUnits) {
        items.push({
          label: 'Rezoning (OZ) likely required',
          why: 'Nearby comparable proposals exceed the as-of-right storey or unit limits for this zone. Anything similar will need an OZ rather than a Site Plan-only path.',
        });
      }

      if (!items.length) {
        requiredStudiesEl.innerHTML = '';
        return;
      }

      const rows = items.map(it =>
        `<li><strong>${escHtml(it.label)}</strong> <span style="color:#6c757d">— ${escHtml(it.why)}</span></li>`
      ).join('');
      requiredStudiesEl.innerHTML = `
        <div style="margin-top:1rem;padding:0.75rem 1rem;background:#f8f9fa;border:1px solid #dee2e6;border-radius:6px">
          <div style="font-size:0.78rem;font-weight:700;margin-bottom:0.4rem;color:#495057">Likely required studies / processes</div>
          <ul style="margin:0;padding-left:1.2rem;font-size:0.78rem;line-height:1.5">${rows}</ul>
        </div>`;
    }

    function renderScenarios(results, nearestComp) {
      const anyPredictions = results.some(r => r.predictions && Object.keys(r.predictions).length > 0);
      if (!anyPredictions) {
        scenariosSection.style.display = 'none';
        return;
      }

      const appealRisks = results.map(r => r.predictions?.prob_dev_appealed ?? Infinity);
      const minRisk = Math.min(...appealRisks);

      const hasTimeline = results.some(r => r.predictions?.pred_dev_days_p50 != null);
      const maxUnits = _lastSiteCtx?.zoning_max_units;
      const hasExcess = maxUnits != null;

      const rows = results.map((r) => {
        const s = r.scenario;
        const p = r.predictions;

        // Compute zoning excess
        let excessCell = '';
        if (hasExcess) {
          const ratio = s.proposed_units / maxUnits;
          if (ratio > 1) {
            const mult = ratio.toFixed(1);
            const cls = ratio > 5 ? 'risk-high' : ratio > 2 ? 'risk-mid' : 'risk-low';
            excessCell = `<td class="${cls}">${mult}x</td>`;
          } else {
            excessCell = `<td style="color:#198754">within</td>`;
          }
        }

        if (!p) {
          return `<tr>
            <td>${escHtml(s.label)}</td>
            <td>${s.application_type}</td><td>${s.proposed_storeys}</td><td>${s.proposed_units}</td>
            ${excessCell}
            <td colspan="${hasTimeline ? 2 : 1}" style="color:#adb5bd">unavailable</td>
          </tr>`;
        }

        const risk = p.prob_dev_appealed;
        const isBest = risk != null && risk === minRisk;
        const riskStr = risk != null ? (risk * 100).toFixed(0) + '%' : '\u2014';
        const riskClass = risk == null ? '' : risk < 0.2 ? 'risk-low' : risk < 0.35 ? 'risk-mid' : 'risk-high';

        let timelineCell = '';
        if (hasTimeline) {
          const p25 = p.pred_dev_days_p25;
          const p50 = p.pred_dev_days_p50;
          const p75 = p.pred_dev_days_p75;
          if (p50 != null) {
            const lo = p25 != null ? Math.round(p25 / 30) : null;
            const mid = Math.round(p50 / 30);
            const hi = p75 != null ? Math.round(p75 / 30) : null;
            const range = (lo != null && hi != null) ? `${lo}\u2013${hi} mo` : `${mid} mo`;
            timelineCell = `<td>${range}</td>`;
          } else {
            timelineCell = '<td>\u2014</td>';
          }
        }

        const bestBadge = isBest ? ' <span class="badge badge-best">Best Fit</span>' : '';

        return `<tr>
          <td>${escHtml(s.label)}${bestBadge}</td>
          <td>${s.application_type}</td>
          <td>${s.proposed_storeys}</td>
          <td>${s.proposed_units}</td>
          ${excessCell}
          <td class="${riskClass}">${riskStr}</td>
          ${hasTimeline ? timelineCell : ''}
        </tr>`;
      }).join('');

      const timelineHeader = hasTimeline ? '<th>Timeline (p25\u2013p75)</th>' : '';
      const excessHeader = hasExcess ? `<th>vs Zoning</th>` : '';

      scenariosBody.innerHTML = `
        <table>
          <thead><tr>
            <th>Scenario</th><th>Type</th><th>Storeys</th><th>Units</th>
            ${excessHeader}
            <th>Appeal Risk</th>${timelineHeader}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }
    // Restore search from URL on page load
    (function () {
      const p = new URLSearchParams(window.location.search);
      if (p.get('address')) {
        document.getElementById('address').value = p.get('address');
        if (p.get('type'))   document.getElementById('type').value   = p.get('type');
        if (p.get('radius')) document.getElementById('radius').value = p.get('radius');
        if (p.get('years'))  document.getElementById('years').value  = p.get('years');
        form.requestSubmit();
      }
    })();

    window.addEventListener('popstate', (e) => {
      const p = e.state ?? Object.fromEntries(new URLSearchParams(window.location.search));
      document.getElementById('address').value = p.address ?? '';
      document.getElementById('type').value   = p.type    ?? '';
      document.getElementById('radius').value = p.radius  ?? 500;
      document.getElementById('years').value  = p.years   ?? 5;
      if (p.address) form.requestSubmit();
    });
  </script>
</body>
</html>
